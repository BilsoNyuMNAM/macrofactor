services:
  postgres:
    image: postgres:16-alpine
    container_name: macrofactor-postgres
    restart: always
    environment:
      POSTGRES_USER: macrofactor
      POSTGRES_PASSWORD: macrofactor_password
      POSTGRES_DB: macrofactor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macrofactor -d macrofactor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
